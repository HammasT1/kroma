<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="KROMA, premium footwear storefront">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#1a130c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a98650"/>
      <stop offset="0.5" stop-color="#f1d9a6"/>
      <stop offset="1" stop-color="#a98650"/>
      <animate attributeName="x1" values="-1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d4b27a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d4b27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="180" cy="60" r="260" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;140 60;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="290" r="300" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-160 -50;0 0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="172" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif" font-size="128" font-weight="900" letter-spacing="30" fill="url(#gold)">KROMA
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <line x1="420" y1="206" x2="780" y2="206" stroke="#d4b27a" stroke-width="2" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
      <animate attributeName="stroke-dashoffset" values="360;0" dur="1.4s" begin="0.4s" fill="freeze"/>
    </line>
    <text x="600" y="256" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="8" fill="#f3eee6" fill-opacity="0.8">PREMIUM FOOTWEAR  ·  COLOR-REACTIVE STOREFRONT
      <animate attributeName="opacity" values="0;0.9" dur="1.2s" begin="0.9s" fill="freeze"/>
    </text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#d4b27a" stroke-opacity="0.25"/>
</svg>
